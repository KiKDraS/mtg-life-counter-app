name: refresh-rules
on:
  schedule:
    - cron: "0 4 * * 1"   # Monday 04:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: node scripts/fetch-rules.mjs
      - name: Open PR when the bundle changed
        run: |
          if git diff --quiet -- features/ai-judge/lib/rag/rules-bundle.json; then
            echo "bundle unchanged — nothing to do"; exit 0
          fi
          BRANCH="chore/rules-refresh-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/ai-judge/lib/rag/rules-bundle.json
          git commit -m "chore: refresh comprehensive rules bundle"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" --title "chore: refresh comprehensive rules bundle" --body "Auto-generated by the weekly rules refresh. CR version changed."