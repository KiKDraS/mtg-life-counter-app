name: refresh-rules
on:
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC — future-dated rules merge on their effective date
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: node scripts/fetch-rules.mjs
      - name: Refresh bundle, merge, release
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          OPEN_ROUTER_EMBEDDING_MODEL: ${{ vars.OPEN_ROUTER_EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- features/ai-judge/lib/rag/rules-bundle.json; then
            echo "bundle unchanged — nothing to do"; exit 0
          fi

          # Future-dated rules: wait until effective date — daily cron re-runs until then.
          EFFECTIVE="$(node -e "const v=require('./features/ai-judge/lib/rag/rules-bundle.json').version;const m=v.match(/effective as of (.+?)\.?\s*$/i);if(!m){console.error('cannot parse effective date: '+v);process.exit(1)}console.log(new Date(Date.parse(m[1])).toISOString().slice(0,10))")"
          TODAY="$(date -u +%Y-%m-%d)"
          if [[ "$EFFECTIVE" > "$TODAY" ]]; then
            echo "rules effective $EFFECTIVE — future vs today $TODAY, skipping merge until effective date"
            exit 0
          fi

          # Embedding bundle (SPEC §9.4): rebuild only when rules actually merge.
          # Missing key → skip (lexical fallback stays). Embed failure never blocks
          # the rules refresh — degradable like the runtime path.
          if [ -n "${OPEN_ROUTER_API_KEY:-}" ]; then
            node scripts/embed-rules.mjs || echo "embed failed — rules refresh proceeds without embeddings"
          else
            echo "OPEN_ROUTER_API_KEY missing — skipping embed (lexical fallback stays)"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CR_VERSION="$(node -p "require('./features/ai-judge/lib/rag/rules-bundle.json').version")"

          # --- bundle PR → develop → merge ---
          BRANCH="chore/rules-refresh-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add features/ai-judge/lib/rag/rules-bundle.json features/ai-judge/lib/rag/embeddings-bundle.json
          git commit -m "chore: refresh comprehensive rules bundle"
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base develop --head "$BRANCH" --title "chore: refresh comprehensive rules bundle" --body "Auto-generated by the weekly rules refresh. CR $CR_VERSION.")"
          gh pr merge "$PR_URL" --merge --delete-branch

          # --- release: develop → release/vX → main + tag + gh release ---
          git fetch origin develop main
          NEW_VERSION="$(node -e "const p=require('./package.json');const [a,b,c]=p.version.split('.').map(Number);console.log(a+'.'+b+'.'+(c+1))")"
          RELEASE_BRANCH="release/v$NEW_VERSION"
          git checkout -b "$RELEASE_BRANCH" origin/develop
          node -e "const fs=require('fs');const p=require('./package.json');const [a,b,c]=p.version.split('.').map(Number);p.version=a+'.'+b+'.'+(c+1);fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          git add package.json
          git commit -m "chore(release): v$NEW_VERSION"
          git push origin "$RELEASE_BRANCH"
          RELEASE_URL="$(gh pr create --base main --head "$RELEASE_BRANCH" --title "release: v$NEW_VERSION" --body "Weekly comprehensive rules refresh — CR $CR_VERSION.")"
          gh pr merge "$RELEASE_URL" --merge --delete-branch

          git checkout main && git pull origin main
          VERSION="$(node -p "require('./package.json').version")"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "Release v$VERSION" --notes "Weekly comprehensive rules refresh — CR $CR_VERSION."

          # --- back-merge release → develop ---
          BACKMERGE_BRANCH="${RELEASE_BRANCH}-backmerge"
          git checkout -b "$BACKMERGE_BRANCH" origin/develop
          git merge origin/main --no-edit
          git push origin "$BACKMERGE_BRANCH"
          BACKMERGE_URL="$(gh pr create --base develop --head "$BACKMERGE_BRANCH" --title "chore: back-merge $RELEASE_BRANCH to develop" --body "Sync release back to develop.")"
          gh pr merge "$BACKMERGE_URL" --merge --delete-branch